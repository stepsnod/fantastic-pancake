# bookthestudiosf.com — existing configuration, with the Call me Eliyahu
# passage review added at the end. Every rule that was here before is unchanged
# and in its original order. The additions are marked.

[build]
  publish = "."

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Private client pages - keep out of search engines and AI crawlers
[[headers]]
  for = "/april*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mauricio-flores*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/soma-live*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ashvita-suresh-kumar*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# ===================== ADDED — Call me Eliyahu passage review ==============
# Everything above this line is the site's existing configuration, unchanged.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# This site publishes from the repository root, so the functions directory sits
# inside the publish root and cannot be moved without restructuring the live
# site. These redirects make that safe by construction: every path that could
# reach function source or manuscript data is served a 404 before it is ever
# read from disk. `force = true` means the rule wins even if a real file exists.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eliyahu/*.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eliyahu/*.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CME_master_candidates*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/passages.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/passages.data.mjs"
  to = "/404.html"
  status = 404
  force = true

# The review pages: out of search engines, never cached.
[[headers]]
  for = "/eliyahu/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
